name: US options AUTO PAPER unit tests
on:
  pull_request:
    paths:
      - 'options_auto_paper/**'
      - '.github/workflows/options-auto-paper.yml'
  push:
    branches:
      - 'feature/options-auto-paper-v1'
    paths:
      - 'options_auto_paper/**'
      - '.github/workflows/options-auto-paper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify options paper simulator
        run: |
          cd options_auto_paper
          python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m py_compile options_auto_paper/options_paper.py
