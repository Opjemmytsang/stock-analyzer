<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Analyzer 技術研究</title><style>body{font:15px system-ui;background:#0b1220;color:#e8f1fa;max-width:850px;margin:auto;padding:18px}a{color:#93c5fd}.panel{background:#17243b;border:1px solid #3c506b;padding:16px;border-radius:12px;margin:12px 0}button{background:#284f83;color:white;border:1px solid #5a80b2;padding:10px;border-radius:8px;margin:4px;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{font-size:23px;font-weight:bold}.muted{color:#aabbd0;font-size:13px}li{margin:6px 0}</style><h1>Stock Analyzer｜技術研究</h1><a href="./index.html">返回期權模擬交易</a><div class="panel"><strong>DEMO · 非真實行情</strong><p class="muted">全部價格及 K 線為虛構示範數據。研究評分並非成功率或交易建議。</p></div><div id="buttons"></div><div class="panel"><h2 id="name">SPY</h2><div class="metrics"><div><div class="muted">評分</div><div class="metric" id="score">—</div></div><div><div class="muted">VWAP</div><div class="metric" id="vwap">—</div></div><div><div class="muted">RVOL</div><div class="metric" id="rvol">—</div></div></div><h3 id="state"></h3><div class="muted">觀察原因</div><ul id="reasons"></ul><div class="muted">風險及未確認事項</div><ul id="risks"></ul></div><script src="./signal-engine.js"></script><script>
const names=['SPY','QQQ','NVDA','TSLA','AMD'];const buttons=document.getElementById('buttons');function show(symbol){const r=OptionRadarEngine.analyze(OptionRadarEngine.demoCandles(symbol));document.getElementById('name').textContent=symbol;document.getElementById('score').textContent=r.score+'/100';document.getElementById('vwap').textContent='$'+r.vwap.toFixed(2);document.getElementById('rvol').textContent=r.rvol.toFixed(2)+'×';document.getElementById('state').textContent=r.state;for(const key of ['reasons','risks']){const el=document.getElementById(key);el.replaceChildren();const arr=key==='risks'?[...r.risks,'未核實真實股價、新聞及期權流動性']:r.reasons;for(const item of arr){const li=document.createElement('li');li.textContent=item;el.append(li)}}}for(const symbol of names){const b=document.createElement('button');b.textContent=symbol;b.onclick=()=>show(symbol);buttons.append(b)}show('SPY');
</script></html>
